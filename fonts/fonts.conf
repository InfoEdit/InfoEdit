<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- fontconfig setup for rendering InfoEdit PPT slides with LibreOffice.
     The benchmark deck uses only open fonts; download them into this folder
     (README, "Fonts for PPT rendering"). scripts/_common.sh points FONTCONFIG_FILE here
     for SOURCE=ppt. The font folder is given relative to the working directory
     (the repo root), which every fontconfig version resolves the same way. Names that carry a weight ("Noto Sans SC Medium") are split
     into family + weight so they match the static font files. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="cwd">fonts</dir>
  <cachedir prefix="cwd">fonts/.fontcache</cachedir>
  <!-- Original (proprietary) face names -> the open replacement used in the deck, so that code
       which hard-codes an original name (e.g. font.name = "Arial") renders with the same font. -->
  <match target="pattern"><test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto</string></edit></match>
  <match target="pattern"><test name="family"><string>AL BAYAN PLAIN</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Arabic</string></edit></match>
  <match target="pattern"><test name="family"><string>Agency FB</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Oswald</string></edit></match>
  <match target="pattern"><test name="family"><string>Al Bayan Plain</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Arabic</string></edit></match>
